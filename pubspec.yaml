name: wsidappp
description: "What Should I Do? — A focused task decider app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Supabase
  supabase_flutter: ^2.8.0

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Navigation
  go_router: ^18.1.3

  # Functional programming
  fpdart: ^1.1.0

  # Environment configuration
  flutter_dotenv: ^6.0.1

  # Utilities
  url_launcher: ^6.3.1
  flutter_local_notifications: ^23.0.0
  flutter_animate: ^4.5.2

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Persistence
  shared_preferences: ^2.3.3

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Code generation annotations (runtime — referenced by generated *.freezed.dart / *.g.dart files)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  confetti: ^0.8.0
  timezone: ^0.11.2
  permission_handler: ^13.0.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  injectable_generator: ^3.1.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  image_path_android: "assets/icon/app_icon_rounded.png"
  adaptive_icon_background: "#5B896F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"
    background_color: "#F8F9FA"
    theme_color: "#52796F"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"

flutter:
  uses-material-design: true

  assets:
    - .env
